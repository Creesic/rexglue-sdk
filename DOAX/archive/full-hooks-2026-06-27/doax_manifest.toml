[[entrypoint.midasm_hook]]
address = 0x8250AAA8
name = "DOAX_SkipLicenseWarningIntro"
jump_address_on_true = 0x8250AAFC

[[entrypoint.midasm_hook]]
address = 0x8250AB1C
name = "DOAX_SkipNinjaViHdMovie"
jump_address_on_true = 0x8250ABA4

# Boot promotion_video: skip only replay (attempt>0). First play runs normally.
[[entrypoint.midasm_hook]]
address = 0x824C12B8
name = "DOAX_SkipPromotionVideoReplay"
registers = ["r3"]
jump_address_on_true = 0x824C12BC

# Press Start: skip the LABEL_12 scene-transition call while the promotion
# handoff is still in the pre-overlay / sched 2/2 phase. A fresh controller
# A/Start edge is latched, but the actual dismiss is expected later through
# LABEL_34 once the overlay is up.
[[entrypoint.midasm_hook]]
address = 0x824C176C
name = "DOAX_SkipAutoPressStartSceneTransition"
registers = ["r31"]
jump_address_on_true = 0x824C1770

# Press Start post-dismiss guard: block the automatic no-input timeout prelude
# while the four-option menu is waiting for a fresh user input edge.
[[entrypoint.midasm_hook]]
address = 0x824C1714
name = "DOAX_SkipPostReadyAutoScenePrelude"
jump_address_on_true = 0x824C1770

# Press Start LABEL_34 completion: after the guest writes dea=0, mark that the
# normal cleanup handoff should be allowed to run once.
[[entrypoint.midasm_hook]]
address = 0x824C1908
name = "DOAX_ForcePressStartLabel34Exit"
after_instruction = true

# Press Start cleanup handoff: the guest clears menu-fiber active and overlay
# immediately before sub_8258CDF8, then yields. Restore the post-dismiss idle
# bytes before that yield, or the old 2/2 transition countdown can finish while
# the cleanup fiber is parked and restart DOAX_MenuWorkFiberLoop in the wrong state.
[[entrypoint.midasm_hook]]
address = 0x824C1948
name = "DOAX_KeepPressStartCleanupActive"
after_instruction = true

# Press Start menu-fiber cleanup return: after sub_8258CDF8 runs, park the
# non-returning worker before it can return into the guest bugcheck thunk.
[[entrypoint.midasm_hook]]
address = 0x824C1950
name = "DOAX_ParkPressStartMenuFiberAfterCleanup"
registers = [
    "r14", "r15", "r16", "r17", "r18", "r19", "r20", "r21",
    "r22", "r23", "r24", "r25", "r26", "r27", "r28", "r31",
]
jump_address_on_true = 0x824C15D0

[project]
game_root = 'assets'
name = 'doax'
sdk_version = "0.8.0"
