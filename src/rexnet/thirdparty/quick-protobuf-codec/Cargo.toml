[package]
name = "quick-protobuf-codec"
version = "0.3.1"
edition = "2021"
rust-version = "1.73.0"
license = "MIT"
repository = "https://github.com/libp2p/rust-libp2p"
description = "Pinned libp2p Protobuf codec with local message-size observation"
publish = false

[dependencies]
asynchronous-codec = "0.7.0"
bytes = "1"
quick-protobuf = "0.8"
thiserror = "1.0"
unsigned-varint = { version = "0.8.0", features = ["std"] }
